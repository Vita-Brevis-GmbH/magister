[project]
name = "cockpit-api"
version = "0.1.0"
description = "Vita Brevis Cockpit — internal ops API for managing Magister instances"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  # Connector-Agenten (ADR-0014): CSR prüfen, Zertifikat ausstellen,
  # SPKI-Fingerprint berechnen.
  "cryptography>=42",
  # API-Key des Agenten wird als argon2id-Hash abgelegt, nie im Klartext.
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "pyright>=1.1",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.extend-per-file-ignores]
"cockpit_api/routers/*.py" = ["B008"]
"cockpit_api/auth.py" = ["B008"]
# S608 (SQL aus Zeichenketten): dieses Modul baut Abfragen mit Schema- und
# Tabellennamen, und die können in Postgres nicht als Bind-Parameter übergeben
# werden. Die Grenze ist `_ident()` — es prüft jeden Bezeichner gegen ein
# enges Muster und quotet ihn. Ein noqa je Zeile wäre hier Rauschen; die
# Begründung steht einmal im Modul-Docstring.
"cockpit_api/services/restore.py" = ["S608"]
# S603 (subprocess mit variablem argv): pgtools ruft pg_dump, pg_restore und
# age auf — das ist der Zweck des Moduls. Kein `shell=True`, argv immer als
# Liste, und die einzigen variablen Bestandteile sind Schema-, Datenbank- und
# Slug-Namen, die vorher gegen IDENTIFIER_PATTERN geprüft wurden. Ein noqa je
# Aufruf sagt nichts, was nicht schon im Modul-Docstring steht.
"cockpit_api/services/pgtools.py" = ["S603"]
# S608, gleiche Sache wie in restore.py: Schema-, Tabellen- und Spaltennamen
# können in Postgres keine Bind-Parameter sein. Die Grenze ist _check_plan()
# und _qualified() — jeder Bezeichner wird gegen IDENTIFIER_PATTERN geprüft
# und gequotet, bevor er ins SQL geht, und _check_plan läuft bei JEDEM Export,
# nicht nur im Test.
"cockpit_api/services/export.py" = ["S608"]
# Dieselbe Sache in den Sicherungstests: sie bauen Testschemas und
# Zählabfragen mit Schema- und Tabellennamen (nicht als Bind-Parameter
# möglich) und rufen age-keygen über PATH auf, wie jeder Betreiber auch.
# Alles Konstanten dieser Datei, keine Eingabewerte.
"tests/test_backup.py" = ["S603", "S607", "S608"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cockpit_api"]
