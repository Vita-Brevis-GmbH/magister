[alembic]
script_location = alembic
# Das Verzeichnis, in dem `alembic` läuft, gehört auf den Suchpfad — sonst
# findet `env.py` das Paket `cockpit_api` nicht. In der Entwicklung fällt
# das nie auf: dort ist die Konsole als Paket installiert. Im Container ist
# sie nur einkopiert (/app/cockpit_api), und die Migration brach ab mit
# „No module named 'cockpit_api'" — beim ersten Aufbau der Plattform genau
# so passiert. Die Datenebene hat diese Zeile seit jeher.
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://cockpit:cockpit@localhost:5433/cockpit

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
