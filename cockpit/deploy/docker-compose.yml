# Console stack. The api and web services are NOT published to the host: the
# only way in is the caddy service's management listener (ADR-0015 D1), and
# that is bound to the management address, never 0.0.0.0.
#
# Required env (put them in a .env next to this file):
#   COCKPIT_BIND_ADDRESS        — the management address, e.g. 10.0.0.5.
#                                 Must not be 0.0.0.0; the api refuses to start.
#   COCKPIT_MANAGEMENT_MARKER   — shared marker between caddy and api.
#                                 Generate with: openssl rand -hex 32
#   COCKPIT_CONNECTOR_MARKER    — the same for the connector listener, and it
#                                 MUST be a different value. Same value on both
#                                 would mean either marker opens either
#                                 listener; the api refuses to start then.
#   COCKPIT_HOSTNAME            — the name on the console certificate.
#   COCKPIT_BOOTSTRAP_TOKEN     — break-glass API token.
#   COCKPIT_SECRET_KEY          — pgcrypto key for the operators' TOTP
#                                 secrets (ADR-0020 D2).
#                                 Generate with: openssl rand -base64 48
#
# Before the first start: build the console UI, otherwise the listener answers
# 404 on everything but /api/* — `cd cockpit/web && pnpm install && pnpm build`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
      POSTGRES_DB: cockpit
    # No host port: Postgres is reachable only by the api service on the
    # compose network (hardening-audit L-04). For local psql access add a
    # temporary `ports: ["5433:5432"]` in an override file, never here.
    volumes:
      - cockpit-pg:/var/lib/postgresql/data
  api:
    build: ../api
    environment:
      COCKPIT_DATABASE_URL: postgresql+asyncpg://cockpit:cockpit@postgres:5432/cockpit
      COCKPIT_BOOTSTRAP_TOKEN: ${COCKPIT_BOOTSTRAP_TOKEN:-change-me-in-prod}
      # ADR-0015 D1: refuse anything that did not come through the management
      # listener, and refuse to start if that listener looks public.
      COCKPIT_REQUIRE_MANAGEMENT_LISTENER: "1"
      COCKPIT_MANAGEMENT_MARKER: ${COCKPIT_MANAGEMENT_MARKER:?COCKPIT_MANAGEMENT_MARKER is required — openssl rand -hex 32}
      COCKPIT_PUBLISHED_ADDRESS: ${COCKPIT_BIND_ADDRESS:?COCKPIT_BIND_ADDRESS is required — the management address, not 0.0.0.0}:4444
      # ADR-0014: der Connector-Kanal auf 46200. Eigener Marker, zwingend
      # anders als der Management-Marker.
      COCKPIT_CONNECTOR_MARKER: ${COCKPIT_CONNECTOR_MARKER:?COCKPIT_CONNECTOR_MARKER is required and must differ from COCKPIT_MANAGEMENT_MARKER}
      COCKPIT_CONNECTOR_CA_CERT: /certs/connector-int.pem
      COCKPIT_CONNECTOR_CA_KEY: /certs/connector-int-key.pem
      # ADR-0019: der private Ed25519-Schlüssel, mit dem Einlösescheine
      # signiert werden. Ohne ihn gibt es die Ausstellroute nicht — die
      # Konsole läuft, kann aber keinen Operator-Zugriff öffnen.
      COCKPIT_OPERATOR_SIGNING_KEY: /certs/operator-signing.pem
      # ADR-0020 D2: damit ist das TOTP-Geheimnis der Operatoren in der
      # Konsolen-Datenbank verschlüsselt (pgcrypto). Pflicht, und nicht mit
      # einem Vorgabewert: ein voreingestellter Schlüssel wäre einer, der auf
      # jeder Installation derselbe ist. Ohne ihn ist keine Anmeldung ausser
      # dem Bootstrap-Token möglich. Gehört in die Sicherung
      # (docs/runbooks/key-rotation.md §5).
      COCKPIT_SECRET_KEY: ${COCKPIT_SECRET_KEY:?COCKPIT_SECRET_KEY is required — openssl rand -base64 48}
    depends_on: [postgres]
    # Deliberately no `ports:` — everything goes through caddy below.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2.8-alpine
    depends_on: [api]
    # THE line that keeps the console off the internet: published on the
    # management address only. Never change the left-hand side to 0.0.0.0 —
    # the api would still refuse to start, but do not rely on that.
    ports:
      - "${COCKPIT_BIND_ADDRESS:?COCKPIT_BIND_ADDRESS is required}:4444:4444"
      # Der Connector-Kanal ist ABSICHTLICH öffentlich: der Agent ruft aus dem
      # Kundennetz an, damit LDAP das Kundennetz nicht verlässt (ADR-0014).
      # Geschützt wird er durch Client-Zertifikat und API-Key, nicht durch die
      # Bindung. Kein Rückfall auf 443 (E11).
      - "0.0.0.0:46200:46200"
    environment:
      COCKPIT_HOSTNAME: ${COCKPIT_HOSTNAME:-console.magister.ch}
      COCKPIT_CONNECTOR_HOSTNAME: ${COCKPIT_CONNECTOR_HOSTNAME:-connect.magister.ch}
      COCKPIT_MANAGEMENT_MARKER: ${COCKPIT_MANAGEMENT_MARKER:?COCKPIT_MANAGEMENT_MARKER is required}
      COCKPIT_CONNECTOR_MARKER: ${COCKPIT_CONNECTOR_MARKER:?COCKPIT_CONNECTOR_MARKER is required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      # Die gebaute Konsolen-Oberfläche (`cd cockpit/web && pnpm build`).
      # Als Verzeichnis und nicht als Image-Schicht: die Oberfläche ändert
      # sich öfter als der Listener, und ein Neubau von Caddy dafür wäre
      # Aufwand ohne Grund.
      - ../web/dist:/srv/console:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for f in /certs/platform-ca.pem /certs/console.pem /certs/console-key.pem \
                 /certs/connector.pem /certs/connector-key.pem; do
          if [ ! -f "$$f" ]; then
            echo "caddy: $$f is missing — the console listener needs the platform CA and"
            echo "       a server certificate. See cockpit/deploy/caddy/README.md and"
            echo "       docs/runbooks/platform-ca.md. Refusing to start."
            exit 1
          fi
        done
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
volumes:
  cockpit-pg:
  caddy-data:
