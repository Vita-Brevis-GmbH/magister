[project]
name = "magister-connector-agent"
version = "0.1.0"
description = "Connector-Agent für Magister — telefoniert aus dem Kundennetz nach Hause (ADR-0014)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  # Die AD-Schicht von Magister, damit die LDAP-Operationen nicht ein zweites
  # Mal geschrieben werden. Seit ADR-0014 ist sie frei von FastAPI.
  "magister-api",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "pyright>=1.1",
]

[project.scripts]
magister-connector = "connector_agent.cli:main"

[tool.uv.sources]
magister-api = { path = "../apps/api", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["connector_agent", "tests"]
# magister_api liefert kein py.typed mit, ist aber vollständig annotiert und
# läuft selbst unter pyright strict. Ein fehlender Stub-Marker ist kein Grund,
# den strict-Modus des Agenten aufzugeben.
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connector_agent"]
