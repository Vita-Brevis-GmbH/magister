name: scripts-ci

# Die Skripte unter `scripts/` bauen und aktualisieren die Plattform. Sie
# hatten bisher keine CI — und genau dort ist zweimal hintereinander eine
# Regression durchgerutscht, die erst auf dem Server auffiel: ein `up` ohne
# Optionen setzte die Bindung der Konsole auf die Vorgabe zurück, und die
# Installation war nach jedem Update unerreichbar.
#
# Wenig, aber verlässlich: Syntaxprüfung für alle Skripte, und der Test, der
# die Rangfolge der Installations-Angaben misst. Beides braucht weder Docker
# noch eine Datenbank.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/**"
      - "deploy/compose/docker-compose*.yml"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    env:
      HAT_KONSOLE_KEY: ${{ secrets.COCKPIT_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # Die Konsole baut sich selbst auf (vitabrevis-cockpit: scripts/cockpit.sh,
      # ADR 0009 dort); plattform-aufbau.sh ruft es auf. Mit ihrem Checkout prüft
      # plattform-konsole.test.sh die Schnittstelle auch gegen das echte Skript,
      # nicht nur gegen eine Attrappe (docs/runbooks/ci-cockpit.md).
      - name: Konsole holen (vitabrevis-cockpit, für die Schnittstelle)
        if: env.HAT_KONSOLE_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: Vita-Brevis-GmbH/vitabrevis-cockpit
          ssh-key: ${{ secrets.COCKPIT_DEPLOY_KEY }}
          path: vitabrevis-cockpit
          persist-credentials: false

      - name: Pfad der Konsole setzen
        run: |
          if [ -f vitabrevis-cockpit/scripts/cockpit.sh ]; then
            echo "MAGISTER_TEST_KONSOLE_DIR=$GITHUB_WORKSPACE/vitabrevis-cockpit" >> "$GITHUB_ENV"
            echo "Konsole (vitabrevis-cockpit): $(git -C vitabrevis-cockpit rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Ohne Checkout von vitabrevis-cockpit mit scripts/cockpit.sh prüft plattform-konsole.test.sh nur gegen eine Attrappe (Secret COCKPIT_DEPLOY_KEY, docs/runbooks/ci-cockpit.md)."
          fi

      - name: Syntax aller Shell-Skripte
        run: |
          fehler=0
          while IFS= read -r datei; do
            bash -n "$datei" || fehler=1
          done < <(find scripts -name '*.sh' -type f)
          exit "$fehler"

      - name: Rangfolge der Installations-Angaben
        run: ./scripts/tests/plattform-konfig.test.sh

      - name: Test-CA nach RFC 5280, auch ohne die Vorgaben von OpenSSL 3
        run: ./scripts/tests/plattform-ca.test.sh

      - name: Ort der Konsole und Umzug in den eigenen Checkout
        run: ./scripts/tests/konsole-pfad.test.sh

      - name: Zustandsbericht für die Überwachung
        run: ./scripts/tests/plattform-zustand.test.sh

      - name: Nächste Schritte nur, solange etwas offen ist
        run: ./scripts/tests/plattform-schritte.test.sh

      - name: Host-Agent führt nur bekannte Aufträge aus
        run: ./scripts/tests/plattform-ops-agent.test.sh

      - name: Jeder Dienst kommt nach einem Neustart des Hosts wieder
        run: ./scripts/tests/compose-neustart.test.sh

      - name: Aufbau der Konsole über scripts/cockpit.sh (Schnittstelle)
        run: ./scripts/tests/plattform-konsole.test.sh
