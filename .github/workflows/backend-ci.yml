name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/api/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"

# Least-privilege default GITHUB_TOKEN: CI only reads the repo (hardening I-04).
permissions:
  contents: read

jobs:
  test:
    # Fest 24.04: dort gibt es postgresql-client-16 passend zum Server.
    # ubuntu-latest ist seit 2026-11 Ubuntu 26.04; dessen pg_restore schreibt
    # "SET transaction_timeout", das ein Server 16 nicht kennt – jede
    # Wiederherstellung in den Backup-Tests scheiterte daran.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: magister_test
          POSTGRES_PASSWORD: magister_test
          POSTGRES_DB: magister_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magister_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MAGISTER_TEST_DATABASE_URL: postgresql+asyncpg://magister_test:magister_test@localhost:5432/magister_test
      HAT_KONSOLE_KEY: ${{ secrets.COCKPIT_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # Die Konsole lebt seit PR #60 im Repo vitabrevis-cockpit. Ohne ihren
      # Checkout überspringen sich die Abgleichstests (Versiegeln,
      # Operator-Assertion, Policy-Keys) – grün, aber ohne Beweis. Gegenstück:
      # die CI des Cockpits holt Magister mit MAGISTER_DEPLOY_KEY.
      - name: Konsole holen (vitabrevis-cockpit, für die Abgleichstests)
        if: env.HAT_KONSOLE_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: Vita-Brevis-GmbH/vitabrevis-cockpit
          ssh-key: ${{ secrets.COCKPIT_DEPLOY_KEY }}
          path: vitabrevis-cockpit
          persist-credentials: false

      - name: Pfad der Konsole setzen
        working-directory: .
        run: |
          if [ -d vitabrevis-cockpit/api/cockpit_api ]; then
            echo "MAGISTER_TEST_KONSOLE_DIR=$GITHUB_WORKSPACE/vitabrevis-cockpit" >> "$GITHUB_ENV"
            echo "Konsole (vitabrevis-cockpit): $(git -C vitabrevis-cockpit rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Secret COCKPIT_DEPLOY_KEY fehlt – die Abgleichstests gegen die Konsole werden übersprungen (docs/runbooks/ci-cockpit.md)."
            echo "**Lücke:** ohne Checkout von vitabrevis-cockpit überspringen sich die Abgleichstests gegen die Konsole (Secret \`COCKPIT_DEPLOY_KEY\`, docs/runbooks/ci-cockpit.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install system libraries
        # WeasyPrint needs Pango / Cairo / GDK-PixBuf at runtime; pure-pip
        # install isn't enough.
        #
        # age + postgresql-client sind fuer die Backup-Tests (ADR-0016 D9) da.
        # Ohne sie ueberspringt tests/integration/test_backup_verify_cli.py
        # sich selbst — und ein uebersprungener Test ist gruen und beweist
        # nichts. Postgres selbst laeuft als Service-Container; pg_dump und
        # pg_restore muessen trotzdem auf dem Runner liegen.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf-2.0-0 \
            age postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Enable pgcrypto in test DB
        env:
          PGPASSWORD: magister_test
        run: psql -h localhost -U magister_test -d magister_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Ruff lint
        run: uv run ruff check magister_api tests

      - name: Ruff format check
        run: uv run ruff format --check magister_api tests

      - name: Pyright (strict)
        run: uv run pyright

      - name: Pytest (unit + integration) with coverage gate
        run: uv run pytest -q --cov=magister_api --cov-report=term-missing --cov-fail-under=75

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: magister-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image (--help on uvicorn entrypoint)
        run: |
          docker run --rm \
            -e MAGISTER_SKIP_MIGRATIONS=1 \
            magister-api:ci uvicorn --help > /dev/null

      - name: Validate compose config
        run: |
          cd deploy/compose
          cp .env.example .env
          sed -i 's/CHANGE_ME/ci_placeholder_secret/g' .env
          docker compose config > /dev/null
