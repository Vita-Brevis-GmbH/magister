# GENERATED by scripts/gen_split.py --strict — do not edit by hand.
# Strict 10-container split (ADR-0011): platform catch-all + one container
# per module; only the ad container holds AD credentials + the sync loop.
# Usage: docker compose -f docker-compose.yml -f <this-file> up -d
# Requires MAGISTER_AD_RPC_SECRET in .env (shared internal bearer).

x-split-api: &split-api
  image: ${MAGISTER_API_IMAGE:-ghcr.io/vita-brevis-gmbh/magister-api:latest}
  restart: unless-stopped
  # Wait for the migrator (base magister-api) to be healthy → schema ready.
  depends_on:
    magister-api:
      condition: service_healthy
  environment: &split-env
    MAGISTER_ENVIRONMENT: production
    MAGISTER_LOG_LEVEL: ${MAGISTER_LOG_LEVEL:-INFO}
    MAGISTER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-magister}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-magister}
    MAGISTER_AUDIT_KEY: ${MAGISTER_AUDIT_KEY:?MAGISTER_AUDIT_KEY is required}
    MAGISTER_SESSION_SECRET: ${MAGISTER_SESSION_SECRET:?MAGISTER_SESSION_SECRET is required}
    MAGISTER_CSRF_SECRET: ${MAGISTER_CSRF_SECRET:?MAGISTER_CSRF_SECRET is required}
    MAGISTER_SESSION_COOKIE_SECURE: "true"
    MAGISTER_OIDC_ISSUER: ${MAGISTER_OIDC_ISSUER}
    MAGISTER_OIDC_CLIENT_ID: ${MAGISTER_OIDC_CLIENT_ID}
    MAGISTER_OIDC_CLIENT_SECRET: ${MAGISTER_OIDC_CLIENT_SECRET}
    MAGISTER_OIDC_REDIRECT_URI: https://${MAGISTER_PUBLIC_HOSTNAME:?MAGISTER_PUBLIC_HOSTNAME is required}/api/auth/callback
    # Strict AD boundary: no AD credentials here — reach AD only via the ad container.
    MAGISTER_AD_RPC_URL: http://magister-api-ad:8000
    MAGISTER_AD_RPC_SECRET: ${MAGISTER_AD_RPC_SECRET:?MAGISTER_AD_RPC_SECRET is required}
    MAGISTER_SKIP_MIGRATIONS: "1"
    MAGISTER_RUN_SCHEDULER: "0"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  networks: [internal]

services:
  # Reconfigure the base catch-all for the strict split.
  magister-api:
    environment:
      MAGISTER_CONTAINER_MODULES: "platform"
      MAGISTER_RUN_SCHEDULER: "0"
      MAGISTER_AD_RPC_URL: http://magister-api-ad:8000
      MAGISTER_AD_RPC_SECRET: ${MAGISTER_AD_RPC_SECRET:?MAGISTER_AD_RPC_SECRET is required}
      MAGISTER_AD_DCS: ""
      MAGISTER_AD_BIND_DN: ""
      MAGISTER_AD_BIND_PASSWORD: ""
      MAGISTER_AD_USERS_SEARCH_BASE: ""
  magister-api-ad:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "ad"
      # The one AD-capable container: real creds, owns the sync loop,
      # blanks the RPC URL so it talks to AD directly.
      MAGISTER_AD_RPC_URL: ""
      MAGISTER_RUN_SCHEDULER: "1"
      MAGISTER_AD_DCS: ${MAGISTER_AD_DCS:-}
      MAGISTER_AD_BIND_DN: ${MAGISTER_AD_BIND_DN:-}
      MAGISTER_AD_BIND_PASSWORD: ${MAGISTER_AD_BIND_PASSWORD:-}
      MAGISTER_AD_USERS_SEARCH_BASE: ${MAGISTER_AD_USERS_SEARCH_BASE:-}
  magister-api-users:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "users"
  magister-api-settings:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "settings"
  magister-api-templates:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "templates"
  magister-api-classes:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "classes"
  magister-api-imports:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "imports"
  magister-api-departments:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "departments"
  magister-api-reports:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "reports"
  magister-api-devices:
    <<: *split-api
    environment:
      <<: *split-env
      MAGISTER_CONTAINER_MODULES: "devices"
